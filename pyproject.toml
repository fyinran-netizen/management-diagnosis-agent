[project]
name = "management-diagnosis-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.8.0",
    "numpy>=2.4.4",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "sentence-transformers>=5.5.0",
    "streamlit>=1.48.0",
    "torchvision>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--basetemp=.pytest_run_tmp"
cache_dir = ".pytest_run_tmp/cache"
