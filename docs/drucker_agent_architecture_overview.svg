<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill:#10213f; }
      .layer-title { font: 700 22px Arial, sans-serif; }
      .layer-sub { font: 13px Arial, sans-serif; fill:#475569; }
      .card-title { font: 700 16px Arial, sans-serif; fill:#10213f; }
      .card-sub { font: 12px Arial, sans-serif; fill:#475569; }
      .legend { font: 12px Arial, sans-serif; fill:#334155; }
      .layer { rx:16; ry:16; stroke-width:2; }
      .card { rx:12; ry:12; stroke-width:1.5; }
      .arrow { stroke:#1f3b57; stroke-width:2.1; fill:none; marker-end:url(#arrow); }
      .support { stroke:#64748b; stroke-width:1.5; fill:none; stroke-dasharray:6 5; marker-end:url(#arrow); }
      .icon-text { font: 700 14px Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1f3b57"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <text x="800" y="46" text-anchor="middle" class="title">
    Drucker Knowledge Base / Management Diagnosis RAG — System Architecture
  </text>

  <!-- LEFT: INPUTS -->
  <g id="inputs">
    <rect x="20" y="95" width="205" height="360" class="layer" fill="#fff8ed" stroke="#d08b47"/>
    <text x="40" y="127" class="layer-title" fill="#8a4b16">Inputs</text>

    <rect x="40" y="155" width="165" height="95" class="card" fill="#ffedd5" stroke="#e7a76a"/>
    <circle cx="67" cy="182" r="15" fill="#f5c98b"/>
    <text x="67" y="187" text-anchor="middle" class="icon-text" fill="#8a4b16">U</text>
    <text x="91" y="180" class="card-title">User Intake</text>
    <text x="58" y="210" class="card-sub">Problem description</text>
    <text x="58" y="228" class="card-sub">Diagnosis type / context</text>

    <rect x="40" y="275" width="165" height="150" class="card" fill="#ffedd5" stroke="#e7a76a"/>
    <circle cx="67" cy="302" r="15" fill="#f5c98b"/>
    <text x="67" y="307" text-anchor="middle" class="icon-text" fill="#8a4b16">K</text>
    <text x="91" y="300" class="card-title">Knowledge Base</text>
    <text x="58" y="330" class="card-sub">Drucker materials</text>
    <text x="58" y="348" class="card-sub">Private knowledge base</text>
    <text x="58" y="366" class="card-sub">Sample corpus</text>
    <text x="58" y="384" class="card-sub">Experiment corpora</text>
  </g>

  <!-- CENTER: INTERFACE -->
  <g id="layer-interface">
    <rect x="250" y="95" width="1080" height="120" class="layer" fill="#eef6ff" stroke="#3b82f6"/>
    <circle cx="278" cy="123" r="16" fill="#3b82f6"/>
    <text x="278" y="128" text-anchor="middle" class="icon-text" fill="#fff">1</text>
    <text x="305" y="130" class="layer-title" fill="#1d4ed8">Interface Layer</text>
    <text x="760" y="129" class="layer-sub">User interaction and application entry points</text>

    <rect x="280" y="150" width="300" height="46" class="card" fill="#dbeafe" stroke="#60a5fa"/>
    <circle cx="305" cy="173" r="12" fill="#bfdbfe"/>
    <text x="305" y="178" text-anchor="middle" class="icon-text" fill="#1d4ed8">UI</text>
    <text x="330" y="179" class="card-title">Streamlit UI</text>

    <rect x="625" y="150" width="300" height="46" class="card" fill="#dbeafe" stroke="#60a5fa"/>
    <circle cx="650" cy="173" r="12" fill="#bfdbfe"/>
    <text x="650" y="178" text-anchor="middle" class="icon-text" fill="#1d4ed8">S</text>
    <text x="675" y="179" class="card-title">Application Services</text>

    <rect x="970" y="150" width="330" height="46" class="card" fill="#dbeafe" stroke="#60a5fa"/>
    <circle cx="995" cy="173" r="12" fill="#bfdbfe"/>
    <text x="995" y="178" text-anchor="middle" class="icon-text" fill="#1d4ed8">R</text>
    <text x="1020" y="179" class="card-title">User-facing Report View</text>
  </g>

  <!-- KNOWLEDGE PREP -->
  <g id="layer-knowledge">
    <rect x="250" y="235" width="1080" height="180" class="layer" fill="#ecfeff" stroke="#06b6d4"/>
    <circle cx="278" cy="263" r="16" fill="#06b6d4"/>
    <text x="278" y="268" text-anchor="middle" class="icon-text" fill="#fff">2</text>
    <text x="305" y="270" class="layer-title" fill="#0e7490">Knowledge Preparation</text>
    <text x="760" y="269" class="layer-sub">Build retrieval-ready knowledge assets</text>

    <rect x="280" y="300" width="220" height="72" class="card" fill="#cffafe" stroke="#22d3ee"/>
    <text x="390" y="330" text-anchor="middle" class="card-title">Ingestion</text>
    <text x="390" y="351" text-anchor="middle" class="card-sub">Load &amp; normalize documents</text>

    <rect x="525" y="300" width="220" height="72" class="card" fill="#cffafe" stroke="#22d3ee"/>
    <text x="635" y="330" text-anchor="middle" class="card-title">Section-aware Chunking</text>
    <text x="635" y="351" text-anchor="middle" class="card-sub">Sentence boundaries + overlap</text>

    <rect x="770" y="300" width="220" height="72" class="card" fill="#cffafe" stroke="#22d3ee"/>
    <text x="880" y="330" text-anchor="middle" class="card-title">Metadata Enrichment</text>
    <text x="880" y="351" text-anchor="middle" class="card-sub">Concepts, labels, summaries</text>

    <rect x="1015" y="300" width="285" height="72" class="card" fill="#cffafe" stroke="#22d3ee"/>
    <text x="1157" y="330" text-anchor="middle" class="card-title">BM25 / Vector Index</text>
    <text x="1157" y="351" text-anchor="middle" class="card-sub">Retrieval-ready stores</text>
  </g>

  <!-- RETRIEVAL -->
  <g id="layer-retrieval">
    <rect x="250" y="435" width="1080" height="190" class="layer" fill="#fff8e7" stroke="#f59e0b"/>
    <circle cx="278" cy="463" r="16" fill="#f59e0b"/>
    <text x="278" y="468" text-anchor="middle" class="icon-text" fill="#fff">3</text>
    <text x="305" y="470" class="layer-title" fill="#b45309">Retrieval &amp; Evidence Layer</text>
    <text x="760" y="469" class="layer-sub">Search, combine, and prepare evidence for generation</text>

    <rect x="300" y="505" width="170" height="72" class="card" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="385" y="535" text-anchor="middle" class="card-title">BM25</text>
    <text x="385" y="556" text-anchor="middle" class="card-sub">Lexical retrieval</text>

    <rect x="500" y="505" width="180" height="72" class="card" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="590" y="535" text-anchor="middle" class="card-title">Embedding</text>
    <text x="590" y="556" text-anchor="middle" class="card-sub">Semantic retrieval</text>

    <rect x="710" y="505" width="180" height="72" class="card" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="800" y="535" text-anchor="middle" class="card-title">Metadata-aided</text>
    <text x="800" y="556" text-anchor="middle" class="card-sub">Structured retrieval signals</text>

    <rect x="920" y="505" width="160" height="72" class="card" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="1000" y="535" text-anchor="middle" class="card-title">Hybrid</text>
    <text x="1000" y="556" text-anchor="middle" class="card-sub">Combined ranking</text>

    <rect x="1110" y="505" width="190" height="72" class="card" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="1205" y="535" text-anchor="middle" class="card-title">Evidence Selection</text>
    <text x="1205" y="556" text-anchor="middle" class="card-sub">Context assembly</text>
  </g>

  <!-- GENERATION -->
  <g id="layer-generation">
    <rect x="250" y="645" width="1080" height="150" class="layer" fill="#f5f3ff" stroke="#8b5cf6"/>
    <circle cx="278" cy="673" r="16" fill="#8b5cf6"/>
    <text x="278" y="678" text-anchor="middle" class="icon-text" fill="#fff">4</text>
    <text x="305" y="680" class="layer-title" fill="#6d28d9">Generation &amp; Validation</text>
    <text x="760" y="679" class="layer-sub">Structured synthesis with validation and recovery</text>

    <rect x="315" y="710" width="250" height="54" class="card" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="440" y="743" text-anchor="middle" class="card-title">Structured Generation</text>

    <rect x="610" y="710" width="190" height="54" class="card" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="705" y="743" text-anchor="middle" class="card-title">Validation</text>

    <rect x="845" y="710" width="220" height="54" class="card" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="955" y="743" text-anchor="middle" class="card-title">Targeted Regeneration</text>

    <rect x="1110" y="710" width="160" height="54" class="card" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="1190" y="743" text-anchor="middle" class="card-title">Recovery</text>
  </g>

  <!-- INFRA -->
  <g id="layer-infra">
    <rect x="250" y="815" width="1080" height="95" class="layer" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="278" cy="843" r="16" fill="#64748b"/>
    <text x="278" y="848" text-anchor="middle" class="icon-text" fill="#fff">5</text>
    <text x="305" y="850" class="layer-title" fill="#475569">Infrastructure / Support</text>

    <rect x="470" y="842" width="180" height="40" class="card" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="560" y="867" text-anchor="middle" class="card-title">Ollama / Qwen 8B</text>

    <rect x="680" y="842" width="180" height="40" class="card" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="770" y="867" text-anchor="middle" class="card-title">BGE-small-zh</text>

    <rect x="890" y="842" width="170" height="40" class="card" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="975" y="867" text-anchor="middle" class="card-title">SQLite / Indexes</text>

    <rect x="1090" y="842" width="180" height="40" class="card" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="1180" y="867" text-anchor="middle" class="card-title">Logging / Runtime</text>
  </g>

  <!-- RIGHT: OUTPUTS -->
  <g id="outputs">
    <rect x="1360" y="165" width="215" height="430" class="layer" fill="#effdf5" stroke="#16a34a"/>
    <text x="1380" y="197" class="layer-title" fill="#166534">Outputs</text>

    <rect x="1380" y="221" width="175" height="88" class="card" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1468" y="253" text-anchor="middle" class="card-title">Retrieved Evidence</text>
    <text x="1468" y="274" text-anchor="middle" class="card-sub">Grounded passages</text>

    <rect x="1380" y="336" width="175" height="88" class="card" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1468" y="368" text-anchor="middle" class="card-title">Structured Report</text>
    <text x="1468" y="389" text-anchor="middle" class="card-sub">Diagnosis sections</text>

    <rect x="1380" y="451" width="175" height="88" class="card" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1468" y="483" text-anchor="middle" class="card-title">User-facing Diagnosis</text>
    <text x="1468" y="504" text-anchor="middle" class="card-sub">Readable final report</text>
  </g>

  <!-- FLOW ARROWS -->
  <path d="M225 205 L250 205" class="arrow"/>
  <path d="M225 350 L250 335" class="arrow"/>

  <path d="M580 173 L625 173" class="arrow"/>
  <path d="M925 173 L970 173" class="arrow"/>

  <path d="M780 372 L780 435" class="arrow"/>
  <path d="M470 541 L500 541" class="arrow"/>
  <path d="M680 541 L710 541" class="arrow"/>
  <path d="M890 541 L920 541" class="arrow"/>
  <path d="M1080 541 L1110 541" class="arrow"/>

  <path d="M1205 577 L1205 645" class="arrow"/>

  <path d="M565 737 L610 737" class="arrow"/>
  <path d="M800 737 L845 737" class="arrow"/>
  <path d="M1065 737 L1110 737" class="arrow"/>

  <path d="M1330 540 L1360 280" class="arrow"/>
  <path d="M1330 737 L1360 395" class="arrow"/>

  <!-- LEGEND -->
  <g id="legend">
    <rect x="20" y="930" width="1555" height="38" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="954" class="card-title">Legend</text>

    <rect x="125" y="942" width="22" height="14" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="158" y="954" class="legend">Interface</text>

    <rect x="270" y="942" width="22" height="14" fill="#cffafe" stroke="#06b6d4"/>
    <text x="303" y="954" class="legend">Knowledge Preparation</text>

    <rect x="480" y="942" width="22" height="14" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="513" y="954" class="legend">Retrieval</text>

    <rect x="625" y="942" width="22" height="14" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="658" y="954" class="legend">Generation &amp; Validation</text>

    <rect x="870" y="942" width="22" height="14" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="903" y="954" class="legend">Infrastructure</text>

    <rect x="1040" y="942" width="22" height="14" fill="#ffedd5" stroke="#d08b47"/>
    <text x="1073" y="954" class="legend">Inputs</text>

    <rect x="1165" y="942" width="22" height="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1198" y="954" class="legend">Outputs</text>
  </g>
</svg>